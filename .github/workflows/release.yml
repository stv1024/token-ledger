name: Release

# Publishes the packed npm tarball with npm Trusted Publishing (GitHub OIDC).
# No npm token is stored anywhere. npm accepts the publish only when this
# repository, this workflow filename, and the tag match the package's trusted
# publisher record on npmjs.com.
#
# Release sequence: bump the version and the changelog, push main, tag the
# release commit (`v<version>`), push the tag, then create the GitHub release
# from that tag. This workflow runs on the tag push; `workflow_dispatch` is for
# a manual retry of the same commit. A version that is already on npm is
# skipped, so a retry or a hand-published first release does not fail.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Pack the npm tarball
        id: pack
        shell: bash
        run: |
          npm run --silent pack:npm > pack.json
          cat pack.json
          node -e "const o=require('./pack.json'),f=require('fs');f.appendFileSync(process.env.GITHUB_OUTPUT,'artifact='+o.artifact+'\nname='+o.name+'\nversion='+o.version+'\n')"

      - name: Check the tag matches the packed version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v${{ steps.pack.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the packed version ${expected}" >&2
            exit 1
          fi

      - name: Check whether the version is already on npm
        id: published
        shell: bash
        run: |
          if npm view "${{ steps.pack.outputs.name }}@${{ steps.pack.outputs.version }}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${{ steps.pack.outputs.name }}@${{ steps.pack.outputs.version }} is already on npm; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish "${{ steps.pack.outputs.artifact }}" --access public --provenance --registry=https://registry.npmjs.org/
